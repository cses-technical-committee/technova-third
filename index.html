<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALGOVERSE 2026 · Technomyst · Third Year Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Animated background: aurora + constellation network -->
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <canvas id="net" aria-hidden="true"></canvas>

  <!-- Header -->
  <header class="topbar">
    <div class="brand" id="brand">
      <svg class="crest" viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e3a6"/><stop offset="1" stop-color="#c9a24a"/></linearGradient></defs>
        <path d="M20 2 L36 11 V29 L20 38 L4 29 V11 Z" fill="none" stroke="url(#gg)" stroke-width="2"/>
        <path d="M20 10 L28 30 H24.6 L23 25.8 H17 L15.4 30 H12 Z M18 22.8 H22 L20 17.2 Z" fill="url(#gg)"/>
      </svg>
      <h1 class="event-name">ALGOVERSE <span>2026</span></h1>
    </div>

    <div class="phase-pill"><span class="spark">✦</span><span id="headerPhase"></span></div>

    <div class="timer" id="timer" hidden>
      <svg class="hg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12M6 22h12M7 2c0 5 5 6 5 10s-5 5-5 10M17 2c0 5-5 6-5 10s5 5 5 10"/></svg>
      <span id="timeText">00:00</span>
      <div class="t-track"><div class="t-fill" id="tFill"></div></div>
    </div>
  </header>

  <main>
    <!-- ============ RULES / ENTRY ============ -->
    <section class="screen intro active" id="introScreen">
      <div class="invite">
        <div class="invite-in">
          <svg class="seal" viewBox="0 0 64 64" aria-hidden="true">
            <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e3a6"/><stop offset="1" stop-color="#b8903a"/></linearGradient></defs>
            <circle cx="32" cy="32" r="28" fill="none" stroke="url(#sg)" stroke-width="1.5" stroke-dasharray="2 4"/>
            <circle cx="32" cy="32" r="21" fill="none" stroke="url(#sg)" stroke-width="2"/>
            <path d="M32 17l4.4 9.2 10.1 1.4-7.3 7 1.8 10L32 39.7 23 44.6l1.8-10-7.3-7 10.1-1.4z" fill="url(#sg)"/>
          </svg>

          <p class="eyebrow">The Senior Challenge &middot; Third Year</p>

          <div class="phase-line">
            <i></i><span id="cardPhase"></span><b>✦</b><span id="cardRound"></span><i></i>
          </div>

          <h2>Rules &amp; Instructions</h2>
          <p class="sub">Please read each rule carefully before you begin</p>

          <div class="meta" id="metaRow"></div>

          <form class="student-details" id="studentDetails">
            <h3>Team details</h3>
            <label for="teamName">Team name</label>
            <input id="teamName" name="team_name" type="text" autocomplete="organization" maxlength="100" required />
            <label for="studentYear">Year</label>
            <input id="studentYear" name="year" type="text" value="3rd Year" readonly required />
            <label for="studentEmail">Email address</label>
            <input id="studentEmail" name="email" type="email" autocomplete="email" maxlength="254" required />
          </form>

          <ol class="rules" id="rulesList"></ol>

          <button class="btn-enter" id="enterBtn" type="button">
            <span>Enter Quiz</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
          <p class="hint">Your timer begins the moment you press <b>Enter Quiz</b>.</p>
        </div>
      </div>
    </section>

    <!-- ============ QUIZ ============ -->
    <section class="screen quiz" id="quizScreen">
      <div class="sections" id="sectionsBar" aria-label="Sections"></div>

      <div class="quiz-wrap">
        <article class="paper" id="paper"></article>
      </div>

      <!-- bottom dock -->
      <div class="dock">
        <div class="dock-in">
          <button class="dbtn" id="prevBtn" aria-label="Previous question">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
            <span>Previous</span>
          </button>

          <button class="dbtn nav" id="navBtn" aria-label="Open question navigator">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            <span><b id="answeredCount">0</b> / <b id="totalCount">0</b></span>
          </button>

          <button class="dbtn primary" id="nextBtn" aria-label="Next question">
            <span>Next</span>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
          <button class="dbtn submit" id="submitBtn" hidden>
            <span>Submit Test</span>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ============ RESULT ============ -->
    <section class="screen result" id="resultScreen">
      <div class="certificate" id="resultCard"></div>
      <p class="submission-status" id="submissionStatus" role="status" aria-live="polite"></p>
    </section>
  </main>

  <!-- Navigator drawer -->
  <div class="drawer-wrap" id="drawerWrap" hidden>
    <div class="drawer-bg" id="drawerBg"></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drTitle">
      <div class="drawer-head">
        <h3 id="drTitle">Question Navigator</h3>
        <button class="x" id="drClose" aria-label="Close">✕</button>
      </div>
      <div class="drawer-body" id="drBody"></div>
      <div class="legend">
        <span><i class="lg lg-ans"></i>Answered</span>
        <span><i class="lg lg-flag"></i>Flagged</span>
        <span><i class="lg lg-empty"></i>Not answered</span>
      </div>
    </aside>
  </div>

  <!-- Confirm submit modal -->
  <div class="modal" id="confirmModal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h3 id="confirmTitle">Submit your test?</h3>
      <p id="confirmText"></p>
      <div class="modal-actions">
        <button class="mbtn ghost" id="reviewBtn">Go back &amp; review</button>
        <button class="mbtn gold" id="confirmSubmitBtn">Yes, submit</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
